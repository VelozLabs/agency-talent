# Supabase local config. `project_id` is set on `supabase link`.
project_id = "training-dashboard"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"

[storage]
enabled = true
# Bucket for Ladder screenshots (provenance for the throwaway parser tier).
[storage.buckets.screenshots]
public = false

[functions.oura-sync]
verify_jwt = true

[functions.apple-health-ingest]
# Receives POSTs from the Health Auto Export phone app; secured by a shared
# bearer secret (APPLE_HEALTH_TOKEN) inside the function, not by Supabase JWT.
verify_jwt = false

[functions.parse-screenshot]
verify_jwt = true
